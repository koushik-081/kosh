[project]
name = "kosh"
version = "0.1.0"
description = "Self-correcting RAG over PDFs, web pages, GitHub repos and YouTube, with deep-link citations, running on local models"
authors = [
    { name = "Koushik Saraswathula", email = "Koushik.Saraswathula@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "openai>=3.39.0",
    "openinference-instrumentation-langchain>=0.1.81",
    "openinference-instrumentation-openai>=0.1.69",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "streamlit>=1.66.1",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
    "youtube-transcript-api>=1.2.4",
]
