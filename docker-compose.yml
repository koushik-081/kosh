services:
  db:
    image: pgvector/pgvector:pg17
    container_name: kosh-db
    environment:
      POSTGRES_USER: kosh
      POSTGRES_PASSWORD: kosh
      POSTGRES_DB: kosh
    ports:
      - "5433:5432"
    volumes:
      - kosh_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosh -d kosh"]
      interval: 5s
      retries: 10

volumes:
  kosh_pgdata:
